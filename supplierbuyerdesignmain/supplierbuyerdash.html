<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupplierBuyer Dashboard</title>
  <link rel="stylesheet" href="/supplierbuyer/supplierbuyerdash.css">
  <style>

      background: linear-gradient(135deg, #1e3c72, #2a5298);

    .product-table th {
      padding: 15px;

      font-weight: 600;
    }
    .product-table td {
      padding: 15px;
      border-bottom: 1px solid #eee;
    }
    .product-table tr:hover {
      background: #f9f9f9;
    }
    .product-image {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
    }
    .btn-edit, .btn-delete {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }
    .btn-edit {
      background: #4caf50;
      color: white;
    }
    .btn-edit:hover {
      background: #45a049;
    }
    .btn-delete {
      background: #f44336;
      color: white;
    }
    .btn-delete:hover {
      background: #da190b;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    .container {
      padding: 30px;
    }
    .title {
      font-size: 26px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .edit-modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.4);
    }
    .edit-modal-content {
      background-color: #fefefe;
      margin: 10% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 90%;
      max-width: 500px;
      border-radius: 8px;
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .close:hover {
      color: black;
    }
    .edit-modal input, .edit-modal textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-save {
      background: #4caf50;
      color: white;
    }
    .btn-cancel {
      background: #999;
      color: white;
    }

    display: none; 
    position: fixed; 
    z-index: 1000; 
    left: 0; top: 0;
    width: 100%; height: 100%; 
    background-color: rgba(0,0,0,0.5); 
}
.modal-content {
    background-color: white;
    margin: 10% auto;
    padding: 25px;
    border-radius: 12px;
    width: 400px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
/* 🔹 Edit Modal Background */
.edit-modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px); /* Modern blur effect */
}

/* 🔹 Modal Content Box */
.edit-modal-content {
    background-color: #ffffff;
    margin: 5% auto;
    padding: 30px;
    border: none;
    width: 90%;
    max-width: 500px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
    from { transform: translateY(-50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

/* 🔹 Modal Typography */
.edit-modal-content h2 {
    margin-top: 0;
    color: #1e3c72;
    font-size: 24px;
    border-bottom: 2px solid #eee;
    padding-bottom: 10px;
    margin-bottom: 20px;
}

.edit-modal-content label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
    color: #444;
    font-size: 14px;
}

/* 🔹 Form Inputs */
.edit-modal-content input[type="text"],
.edit-modal-content input[type="number"],
.edit-modal-content textarea {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 15px;
    transition: border-color 0.3s;
}

.edit-modal-content input:focus,
.edit-modal-content textarea:focus {
    border-color: #2a5298;
    outline: none;
    box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
}

/* 🔹 File Input Styling */
.edit-modal-content input[type="file"] {
    margin-top: 10px;
    padding: 10px;
    background: #f8f9fa;
    border: 1px dashed #ccc;
    border-radius: 6px;
    width: 100%;
    cursor: pointer;
}

/* 🔹 Action Buttons */
.modal-buttons {
    display: flex;
    gap: 12px;
    margin-top: 25px;
}

.modal-buttons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: 0.3s;
}

.btn-save {
    background: linear-gradient(135deg, #4caf50, #45a049);
    color: white;
}

.btn-save:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
}

.btn-cancel {
    background: #e0e0e0;
    color: #666;
}

.btn-cancel:hover {
    background: #d5d5d5;
}

/* 🔹 Close 'X' Button */
.close {
    color: #aaa;
    float: right;
    font-size: 24px;
    font-weight: bold;
    line-height: 20px;
}

.close:hover {
    color: #f44336;
    cursor: pointer;
}
    .product-table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
/* 🔹 Modern Responsive Dashboard */
:root { --primary: #1e3c72; --secondary: #2a5298; --success: #4caf50; --danger: #f44336; }

.container { padding: 20px; max-width: 1200px; margin: auto; }

/* 🔹 Responsive Table */
.product-table { width: 100%; border-collapse: separate; border-spacing: 0 10px; background: transparent; }
.product-table thead tr { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
.product-table th { padding: 15px; border-radius: 0; }
.product-table th:first-child { border-radius: 8px 0 0 8px; }
.product-table th:last-child { border-radius: 0 8px 8px 0; }

.product-table tbody tr { background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; }
.product-table tbody tr:hover { transform: scale(1.01); }
.product-table td { padding: 15px; border: none; }

@media (max-width: 768px) {
    .product-table thead { display: none; }
    .product-table td { display: block; text-align: right; border-bottom: 1px solid #eee; }
    .product-table td::before { content: attr(data-label); float: left; font-weight: bold; }
}

/* 🔹 Glassmorphism Modal */
.modal {
    display: none; position: fixed; z-index: 1000; left: 0; top: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
}

.modal-content {
    background: white; margin: 5% auto; padding: 30px; border-radius: 16px;
    width: 90%; max-width: 500px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    animation: fadeInUp 0.4s ease-out;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.modal-content input, .modal-content textarea {
    width: 100%; padding: 12px; margin: 10px 0; border: 1.5px solid #e2e8f0;
    border-radius: 8px; font-size: 16px; transition: 0.2s;
}

.modal-content input:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1); }

.btn-save { background: var(--success); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
.btn-save:hover { background: #45a049; }
  </style>
</head>
<body>

<!-- 🔹 Navbar -->
<header class="navbar">
  <div class="logo">SupplierBuyer Admin</div>

  <div class="menu-toggle" id="menuToggle">☰</div>

  <nav class="nav-links" id="navLinks">
    <a href="/supplierbuyer/supplierbuyerdash.html">Dashboard</a>
    <a href="/supplierbuyer/profileadmin.html">Profile Admin</a>
    <a href="/supplierbuyer/messageadmin.html">Messages</a>
    <a href="/upload_product">Upload Product</a>
    <a href="/supplierbuyer/supplierbuyerhome.html">View Products</a>
    <a href="/logout" class="logout">Logout</a>
  </nav>
</header>

<div class="container">
  <h1 class="title">Product Management</h1>
  <table class="product-table">
    <thead>
      <tr>
        <th>Image</th>
        <th>Name</th>
        <th>Price</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="productsTableBody">
      <tr><td colspan="5" class="empty-state">Loading products...</td></tr>
    </tbody>
  </table>
</div>

<div id="editModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeEditModal()">&times;</span>
    <h2>Edit Product</h2>
    
    <input type="hidden" id="editProductIndex">
    
    <label>Product Name</label>
    <input type="text" id="editName" placeholder="Enter product name">
    
    <label>Price ($)</label>
    <input type="number" id="editPrice" step="0.01" placeholder="0.00">
    
    <label>Description</label>
    <textarea id="editDescription" rows="4" placeholder="Describe the product..."></textarea>
    
    <label>Update Product Image</label>
    <input type="file" id="editImage" accept="image/*">
    <p style="font-size: 11px; color: #718096; margin-top: 5px;">Leave empty to keep current image.</p>
    
    <div class="modal-buttons">
        <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
        <button type="button" class="btn-save" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<script>
  let products = [];

  function loadProducts() {
    fetch("/api/products")
      .then(r => r.json())
      .then(data => {
        products = data;
        displayProducts();
      });
  }

  function displayProducts() {
    const tbody = document.getElementById('productsTableBody');
    if (products.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No products found.</td></tr>';
      return;
    }
    tbody.innerHTML = products.map((p, index) => `
      <tr style="cursor: pointer;" onclick="viewProduct(${index})">
        <td>${p.image ? `<img src="${p.image}" class="product-image">` : 'No Image'}</td>
        <td><strong>${p.name}</strong></td>
        <td>$${parseFloat(p.price).toFixed(2)}</td>
        <td>${p.description || 'N/A'}</td>
        <td onclick="event.stopPropagation();">
          <div class="action-buttons">
            <button class="btn-edit" onclick="openEditModal(${index})">Edit</button>
            <button class="btn-delete" onclick="deleteProduct(${index})">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  // Edit Logic
  function openEditModal(index) {
    const p = products[index];
    document.getElementById('editProductIndex').value = index;
    document.getElementById('editName').value = p.name;
    document.getElementById('editPrice').value = p.price;
    document.getElementById('editDescription').value = p.description || '';
    document.getElementById('editModal').style.display = 'block';
  }

  function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

function saveEdit() {
    const idx = document.getElementById('editProductIndex').value;
    const formData = new FormData();
    formData.append("index", idx);
    formData.append("name", document.getElementById('editName').value);
    formData.append("price", document.getElementById('editPrice').value);
    formData.append("description", document.getElementById('editDescription').value);
    
    const fileInput = document.getElementById('editImage');
    if (fileInput.files.length > 0) {
        formData.append("image", fileInput.files[0]);
    }

    fetch('/api/update_product_with_image', {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            alert("Product updated successfully!");
            closeEditModal();
            location.reload(); 
        } else {
            alert('Update failed on server');
        }
    }).catch(err => console.error("Update Error:", err));
}

  function deleteProduct(index) {
    if (confirm('Delete this product?')) {
      products.splice(index, 1);
      updateBackend();
    }
  }

  function updateBackend() {
    fetch('/api/update_products', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(products)
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        closeEditModal();
        displayProducts();
      }
    });
  }

  function viewProduct(index) {
    window.location.href = `/supplierbuyer/detailproduct_supplierbuyer.html?id=${index}`;
  }

  document.querySelector('.close').onclick = closeEditModal;
  loadProducts();
</script>
</body>
</html>
