<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Messages</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f9; }
    h1, h3 { color: #333; margin: 0; }
    .container { display: flex; height: 100vh; }
    .sidebar { width: 320px; border-right: 1px solid #ddd; overflow-y: auto; background: #fafafa; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid #ddd; }
    #conversationList { flex: 1; overflow-y: auto; }
    .conversation { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #eee; }
    .conversation:hover, .conversation.active { background: #e9e9e9; }
    .conversation b { display: block; font-size: 14px; color: #000; }
    .conversation span { font-size: 13px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #E5DDD5; }
    .chat-header { padding: 15px; border-bottom: 1px solid #ddd; background: #f1f1f1; font-weight: bold; }
    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { padding: 8px 12px; border-radius: 8px; max-width: 60%; line-height: 1.4; }
    .sent { background: #DCF8C6; align-self: flex-end; }
    .received { background: #FFFFFF; align-self: flex-start; }
    .meta { font-size: 11px; color: #888; margin-top: 4px; text-align: right; }
    .chat-input-area { border-top: 1px solid #ddd; padding: 10px; background: #f1f1f1; }
    #adminReplyForm { display: flex; gap: 10px; }
    #adminReplyForm textarea { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; resize: none; }
    #adminReplyForm button { padding: 10px 20px; background: #007BFF; color: #fff; border: none; border-radius: 20px; cursor: pointer; }
    #placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #888; }
    
    /* 🟢 ADDED STYLES 🟢 */
    .message { position: relative; } /* Needed for absolute positioning */
    .delete-btn {
      position: absolute;
      top: -5px;
      right: 5px;
      font-size: 16px;
      font-weight: bold;
      color: #aaa;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
      display: none; /* Hide by default */
      z-index: 10;
    }
    .message:hover .delete-btn { display: block; } /* Show on hover */
    .delete-btn:hover { color: #000; }
    
    /* Make chat header a flex container to hold the button */
    .chat-header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
    }
    .clear-chat-btn {
      font-size: 12px;
      padding: 5px 10px;
      background: #dc3545;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .clear-chat-btn:hover { background: #c82333; }
    /* 🟢 END ADDED STYLES 🟢 */

  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>📩 All Messages</h1>
      </div>
      <div id="conversationList">
        </div>
    </div>
    <div class="chat-area">
      <div id="placeholder">
        <p>Select a conversation to start chatting.</p>
      </div>
      <div id="chatWindow" style="display:none; flex:1; flex-direction:column;">
        <div class="chat-header" id="chatHeader"></div>
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input-area">
            <form id="adminReplyForm">
              <input type="hidden" name="product_id" id="reply_product_id">
              <input type="hidden" name="receiver" id="reply_receiver">
              <input type="hidden" name="sender" value="Admin"> 
              <textarea name="message" placeholder="Type your reply..." required></textarea>
              <button type="submit">Send</button>
            </form>
        </div>
      </div>
    </div>
  </div>

<script>
 let allMessages = [];

async function loadConversations() {
    const res = await fetch('/api/messages');
    allMessages = await res.json();
    
    // Get unique users who are not Admin
    const buyers = [...new Set(allMessages.filter(m => m.sender !== "Admin").map(m => m.sender))];
    
    const list = document.getElementById('conversationList');
    list.innerHTML = ""; 
    buyers.forEach(buyerName => {
        const div = document.createElement('div');
        div.className = "conversation";
        div.innerHTML = `<strong>User: ${buyerName}</strong>`;
        div.onclick = () => viewChat(buyerName);
        list.appendChild(div);
    });
}

function viewChat(buyerName) {
    document.getElementById("placeholder").style.display = "none";
    document.getElementById("chatWindow").style.display = "flex";
    document.getElementById("chatHeader").innerText = "Chatting with: " + buyerName;
    document.getElementById("reply_receiver").value = buyerName;

    const chatBox = document.getElementById("chatBox");
    chatBox.innerHTML = "";

    // Show messages between Admin and this specific user
    const chatHistory = allMessages.filter(m => m.sender === buyerName || m.receiver === buyerName);

    chatHistory.forEach(m => {
        const msgDiv = document.createElement("div");
        msgDiv.style = m.sender === "Admin" ? "text-align: right; color: blue;" : "text-align: left;";
        msgDiv.innerHTML = `<p style="background:#eee; padding:8px; border-radius:10px; display:inline-block;">
                            <strong>${m.sender}:</strong> ${m.text}</p>`;
        chatBox.appendChild(msgDiv);
    });
}

document.getElementById("adminReplyForm").onsubmit = async function(e) {
    e.preventDefault();
    const receiver = document.getElementById("reply_receiver").value;
    const body = new URLSearchParams({
        product_id: "admin_reply", 
        sender: "Admin",
        receiver: receiver,
        message: this.querySelector("textarea").value
    });

    await fetch("/api/messages", { method: "POST", body: body });
    this.querySelector("textarea").value = "";
    loadConversations().then(() => viewChat(receiver));
};

setInterval(loadConversations, 3000); // Auto-refresh
</script>

</body>
</html>
