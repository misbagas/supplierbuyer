<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
/* Reset and base styles */
/* Reset and base styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    color: #333;
    background-color: #f9f9f9; /* Neutral light gray background */
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 40px;
}

header h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
    color: #1976d2; /* Blue for main header */
}

header p {
    color: #666; /* Neutral gray for subtitle */
}

main {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
}

.contact-info, .contact-form {
    flex: 1;
    min-width: 300px;
    background: #ffffff; /* White background for sections */
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Subtle neutral shadow */
    border: 1px solid #e0e0e0; /* Light gray border */
}

.contact-info h2, .contact-form h2 {
    margin-bottom: 20px;
    color: #1976d2; /* Blue for section headers */
}

.contact-info p {
    margin-bottom: 10px;
    color: #555; /* Neutral dark gray */
}

form {
    display: flex;
    flex-direction: column;
}

label {
    margin-bottom: 5px;
    font-weight: bold;
    color: #333; /* Neutral black for labels */
}

input, textarea {
    margin-bottom: 15px;
    padding: 10px;
    border: 1px solid #ccc; /* Neutral gray border */
    border-radius: 4px;
    font-size: 1em;
    background-color: #fafafa; /* Very light gray background */
}

input:focus, textarea:focus {
    border-color: #1976d2; /* Blue accent on focus */
    outline: none;
}

button {
    padding: 10px;
    background-color: #1976d2; /* Blue button */
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1em;
    transition: background-color 0.3s;
}

button:hover {
    background-color: #1565c0; /* Darker blue on hover */
}

footer {
    text-align: center;
    margin-top: 40px;
    padding: 20px;
    background: #1976d2; /* Neutral dark gray footer */
    color: #fff;
}

/* Responsive design */
@media (max-width: 768px) {
    main {
        flex-direction: column;
    }
}
    </style>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <p>We'd love to hear from you. Send us a message!</p>
    </header>
    
    <main>
        <section class="contact-info">
            <h2>Get in Touch</h2>
            <p><strong>Email:</strong> pengusahaid@protonmail.com</p>
        </section>
        
    </main>
    
</body>
</html>
