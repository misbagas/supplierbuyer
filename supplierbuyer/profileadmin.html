<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f4f4; margin:0; padding:20px; }
    .container { max-width:600px; margin:0 auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-bottom:20px; color:#00a6e1; }
    label { display:block; margin:10px 0 5px; }
    input { width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; }
    button { margin-top:15px; padding:10px 15px; background:#007BFF; color:#fff; border:none; border-radius:4px; cursor:pointer; }
    button:hover { background:#0056b3; }
    #profileDisplay { margin-top:20px; padding:15px; background:#f9f9f9; border:1px solid #ddd; border-radius:6px; }
    #msg { margin-top:15px; font-weight:bold; color:green; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Profile Admin</h2>

    <!-- Combined Profile + Login Info Form -->
    <form id="profileForm">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="newUsername">Username</label>
      <input type="text" id="newUsername" name="newUsername" required>

      <label for="newPassword">Password</label>
      <input type="password" id="newPassword" name="newPassword" required>

      <button type="submit">Save Profile</button>
    </form>

    <!-- Success message -->
    <p id="msg"></p>

    <!-- Display Current Profile -->
    <div id="profileDisplay">
      <h3>Current Profile</h3>
      <p><b>Name:</b> <span id="dispName"></span></p>
      <p><b>Email:</b> <span id="dispEmail"></span></p>
    </div>
  </div>

  <script>
    async function loadProfile() {
      const res = await fetch('/api/profile');
      if (res.ok) {
        const data = await res.json();
        document.getElementById('name').value = data.name || "";
        document.getElementById('email').value = data.email || "";
        document.getElementById('newUsername').value = data.name || "";
        document.getElementById('dispName').textContent = data.name || "-";
        document.getElementById('dispEmail').textContent = data.email || "-";
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new URLSearchParams(new FormData(e.target));

      // 1️⃣ Update basic profile (name + email)
      await fetch('/api/update_profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData
      });

      // 2️⃣ Update login info (username + password)
      await fetch('/api/update_login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData
      });

      document.getElementById('msg').textContent = "Profile updated successfully!";
      loadProfile();
    });

    // Load when page opens
    loadProfile();
  </script>
</body>
</html>
